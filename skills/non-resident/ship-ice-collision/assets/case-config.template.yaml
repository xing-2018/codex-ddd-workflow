# Standard case template. null requires project or adapter input; it is not a recommended value.
schema_version: "1.0"

case:
  id: null
  title: null
  mode: null                    # diagnostic | verification | formal
  status: draft
  unit_system: null
  work_dir: null
  results_dir: null
  report_path: null

software:
  solver:
    executable: null
    version: null
    precision: null             # single | double
    parallel_mode: null         # smp | mpp | hybrid
    ncpu: null
    memory: null
