      enabled: true
      status: pending
      thresholds: {}
      sample_times: []
      regions: []
      required_evidence: []
    g1: *stage_template
    a1: *stage_template
    a2: *stage_template
    b1: *stage_template
    b2: *stage_template
    c: *stage_template

provenance:
