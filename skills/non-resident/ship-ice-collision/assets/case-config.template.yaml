  speed_curve:
    mode: null
    full_speed_time: null
    data_uri: null
  expected_first_contact_time: null
  termination_time: null

outputs:
  required_files: [messag, d3hsp, glstat, matsum, d3plot]
  binary_interval: null
  ascii_interval: null
  contact_load:
    source: null
    preserve_raw: true
    smooth: false
    interpolate: false
    fit: false
  field_outputs: [water_volume_fraction, air_volume_fraction]

acceptance:
